<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ώρα 5 – Ψύξη του υπολογιστή</title>
<style>
:root{--acc:#1672A3;--soft:#E3F1F8;--bg:#f5f6f7;--card:#fff;--ink:#1f2629;--muted:#5d6a70;--line:#d8dfe2;--a:#2e9e5b;--b:#e0a100;--c:#d8483b;--ok:#2e9e5b;--bad:#d8483b}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px}
header{background:var(--acc);color:#fff;padding:16px 20px}
header h1{margin:0;font-size:24px}header p{margin:4px 0 0;opacity:.88;font-size:15px}
.tabs{display:flex;gap:8px;padding:12px 20px;flex-wrap:wrap;background:var(--soft)}
.tab{border:2px solid transparent;background:#fff;border-radius:10px;padding:10px 16px;font-size:17px;cursor:pointer;font-weight:600;color:var(--ink)}
.tab .dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.tab.active{border-color:var(--acc)}
main{max-width:1100px;margin:0 auto;padding:18px}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:18px}
h2{margin:0 0 6px;font-size:22px}
.help{color:var(--muted);margin:0 0 12px}
.badge{display:inline-block;border-radius:20px;padding:2px 10px;color:#fff;font-size:14px;font-weight:700;margin-right:6px;vertical-align:2px}
.score{font-size:19px;font-weight:700;background:var(--soft);border-radius:10px;padding:10px 14px;display:inline-block;margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1.3fr;gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.item,.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:17px;cursor:pointer;color:var(--ink);font-family:inherit}
.item:hover,.opt:hover{border-color:var(--acc)}
.item.sel{border-color:var(--acc);background:var(--soft)}
.item.done,.opt.ok{border-color:var(--ok);background:#e6f6ec;cursor:default}
.opt.no{border-color:var(--bad);background:#fdeceb}
.wrong{animation:shake .35s;border-color:var(--bad)!important;background:#fdeceb!important}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
button.big{font-size:17px;padding:10px 18px;border-radius:10px;border:none;background:var(--acc);color:#fff;cursor:pointer;font-weight:600;margin:6px 6px 0 0;font-family:inherit}
button.ghost{background:#fff;color:var(--acc);border:2px solid var(--acc)}
.flash{font-size:22px;font-weight:600;min-height:90px;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--soft);border-radius:14px;padding:18px;margin:10px 0}
.cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cat{font-size:18px;padding:12px 18px;border-radius:12px;border:2px solid var(--acc);background:#fff;color:var(--acc);cursor:pointer;font-weight:700;font-family:inherit}
.cat:hover{background:var(--soft)}
.expl{border-radius:10px;padding:10px 12px;background:#fff7e0;margin-top:8px}
.progress{height:10px;background:#e3e8ea;border-radius:6px;overflow:hidden;margin:6px 0 12px}
.progress i{display:block;height:100%;background:var(--acc);width:0}
ol.built{padding-left:26px;margin:8px 0}
ol.built li{background:#e6f6ec;border-radius:8px;padding:8px 10px;margin-bottom:6px;border:2px solid var(--ok)}
.q{font-size:19px;font-weight:600;margin:6px 0 12px}
table.calc{border-collapse:collapse;width:100%}
table.calc td,table.calc th{border-bottom:1px solid var(--line);padding:7px;text-align:left;font-size:16px;vertical-align:middle}
select,input{font-size:16px;padding:6px 8px;border-radius:8px;border:1px solid #b9c3c7;font-family:inherit}
input[type=number]{width:100px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.stat{background:var(--soft);border-radius:12px;padding:12px}
.stat b{display:block;font-size:28px;color:var(--acc)}
.note{background:#eef3f7;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:16px}
.warn{background:#fdeceb;border-radius:10px;padding:10px 12px;margin-top:10px}
.ok-t,.stat b.ok-t{color:var(--ok);font-weight:700}.no-t,.stat b.no-t{color:var(--bad);font-weight:700}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px}
</style>
</head>
<body>
<header><h1 id="h1"></h1><p id="sub"></p></header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<footer>Εγκατάσταση, Διαχείριση και Συντήρηση Υπολογιστικών Συστημάτων · Κεφάλαιο 2 · Λειτουργεί χωρίς internet</footer>
<script>
const DATA = {"title":"Ώρα 5 – Ψύξη του υπολογιστή","sub":"Κεφάλαιο 2 · §2.5 · Ξεκίνα από την πράσινη καρτέλα (Α) και προχώρα όσο θέλεις.","levels":{"A":{"tab":"Είδη ψύξης","acts":[{"type":"sort","title":"Παθητική, ενεργή ή υδρόψυξη;","cats":["Παθητική","Ενεργή","Υδρόψυξη"],"items":[["Ψύκτρα αλουμινίου πάνω στη μνήμη RAM",0],["Ανεμιστήρας πάνω στην ψύκτρα του επεξεργαστή",1],["Αντλία και ψυγείο (radiator)",2],["Ανοίγματα στο πάνω μέρος της θήκης",0,"Εκμεταλλευόμαστε ότι ο ζεστός αέρας ανεβαίνει."],["Ανεμιστήρας στην οροφή της θήκης",1],["Water block πάνω στον επεξεργαστή",2],["Λειτουργία εξοικονόμησης ενέργειας στα Windows",0,"Λιγότερη ενέργεια → λιγότερη θερμότητα."],["Χάλκινη ψύκτρα στο chipset",0],["Ανεμιστήρας στο τροφοδοτικό",1],["Επιλογή εξαρτημάτων χαμηλής κατανάλωσης",0],["Σωλήνες με ψυκτικό υγρό",2],["Κάρτα γραφικών με ενσωματωμένο ανεμιστήρα",1]]},{"type":"match","title":"Όροι ψύξης","pairs":[["Ψύκτρα (heat sink)","Μέταλλο που αυξάνει την επιφάνεια επαφής με τον αέρα"],["Θερμοαγώγιμη πάστα","Γεμίζει τις ατέλειες ανάμεσα σε ψύκτρα και επεξεργαστή"],["Heat pipe","Χάλκινος σωλήνας που μεταφέρει θερμότητα"],["RPM","Στροφές ανά λεπτό"],["PWM","Έλεγχος στροφών με παλμούς (ανεμιστήρας 4 καλωδίων)"],["CPU_FAN","Υποδοχή του ανεμιστήρα του επεξεργαστή"],["CHA_FAN","Υποδοχή ανεμιστήρα θήκης"],["Fan guard","Πλέγμα προστασίας του ανεμιστήρα"],["Water block","Εξάρτημα υδρόψυξης πάνω στο κύκλωμα"],["Radiator","Ψυγείο της υδρόψυξης με ανεμιστήρες"]]}]},"B":{"tab":"Σειρά & μετατροπές","acts":[{"type":"order","title":"Τοποθέτηση ψύξης επεξεργαστή","steps":["Καθαρίζω επεξεργαστή και ψύκτρα από παλιά πάστα","Βάζω λίγη θερμοαγώγιμη πάστα στο κέντρο του επεξεργαστή","Τοποθετώ την ψύκτρα","Ασφαλίζω τον μηχανισμό στερέωσης στη βάση","Συνδέω τον ανεμιστήρα στην υποδοχή CPU_FAN"]},{"type":"order","title":"Συντήρηση ψύξης επεξεργαστή","steps":["Αποσυνδέω το καλώδιο του ανεμιστήρα και ελευθερώνω προσεκτικά την ψύκτρα","Καθαρίζω την παλιά πάστα με μαλακό, ελαφρά υγρό πανί","Καθαρίζω ανεμιστήρα και ψύκτρα με πεπιεσμένο αέρα και πινέλο","Φυσάω τα υπολείμματα με πεπιεσμένο αέρα","Βάζω νέα πάστα και τοποθετώ ξανά την ψύξη"]},{"type":"calc","calc":"temp","title":"Μετατροπές και θερμοκρασία δωματίου","help":"Γράψε μια τιμή και δες το αποτέλεσμα."}]},"C":{"tab":"Σενάρια","acts":[{"type":"mcq","title":"Τι κάνεις;","qs":[{"q":"Μετά από 3 χρόνια σε σκονισμένο χώρο, ο υπολογιστής κλείνει μόνος του όταν δουλεύει πολύ. Τι ελέγχεις πρώτα;","o":["Σκόνη σε ανεμιστήρες και ψύκτρες, και την πάστα του επεξεργαστή","Την ταχύτητα του ίντερνετ","Το πληκτρολόγιο","Την οθόνη"],"e":"Η σκόνη μονώνει και ανεβάζει τη θερμοκρασία· η παλιά πάστα χάνει τις ιδιότητές της."},{"q":"Θέλεις πιο αθόρυβο υπολογιστή χωρίς να χάσεις ψύξη. Τι κάνεις;","o":["Βάζω μεγαλύτερη ψύκτρα και ανεμιστήρα, με λιγότερες στροφές","Αφαιρώ όλους τους ανεμιστήρες","Κλείνω τα ανοίγματα της θήκης","Βάζω τον υπολογιστή σε ντουλάπι"],"e":"Μεγαλύτερα εξαρτήματα → λιγότερα RPM → λιγότερος θόρυβος."},{"q":"Καθαρίζεις με φυσητήρα. Τι κάνεις με τους ανεμιστήρες;","o":["Τους κρατάω με το χέρι για να μη γυρίσουν υπερβολικά","Τους αφήνω να γυρίζουν γρήγορα","Τους βρέχω","Τους λαδώνω"],"e":""},{"q":"Σε ποια απόσταση κρατάμε τον φυσητήρα;","o":["50–70 εκ.","5–10 εκ.","2 μέτρα","Σε επαφή"],"e":""},{"q":"Πόσο συχνά καθαρίζουμε έναν υπολογιστή γραφείου (8 ώρες/μέρα);","o":["1–2 φορές τον χρόνο","Κάθε εβδομάδα","Κάθε μήνα","Κάθε 5 χρόνια"],"e":""},{"q":"Πού συνδέεται ανεμιστήρας 2 καλωδίων;","o":["Απευθείας στο τροφοδοτικό","CPU_FAN","CHA_FAN","Σε θύρα USB"],"e":""},{"q":"Με ποια τεχνική ελέγχονται οι στροφές ανεμιστήρα 4 καλωδίων;","o":["PWM","Αλλαγή τάσης","Δεν ελέγχονται","Με jumper"],"e":""},{"q":"Μειονέκτημα της υδρόψυξης κατά το βιβλίο;","o":["Υψηλότερο κόστος και σύνθετη εγκατάσταση","Περισσότερος θόρυβος","Χειρότερη απόδοση","Δεν χρειάζεται ανεμιστήρες"],"e":""},{"q":"Γιατί το πινέλο χρησιμοποιείται μόνο σε πτερύγια, πρόσοψη και πλαίσιο;","o":["Μπορεί να δημιουργήσει στατικό ηλεκτρισμό","Είναι πολύ σκληρό","Αφήνει νερό","Μαγνητίζει τα εξαρτήματα"],"e":""},{"q":"Πόση θερμοαγώγιμη πάστα βάζουμε;","o":["Λίγη, στο κέντρο, μόνο στον επεξεργαστή","Πολλή σε όλη την ψύκτρα","Στις επαφές της βάσης","Καθόλου"],"e":""}]}]}}};
const LV = {A:['Α','var(--a)','Ξεκινάω'],B:['Β','var(--b)','Προχωράω'],C:['Γ','var(--c)','Πρόκληση']};
const $ = (t,a={},h='')=>{const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else if(k.startsWith('on'))e[k]=a[k];else e.setAttribute(k,a[k])}if(h!=='')e.innerHTML=h;return e};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const shake=el=>{el.classList.remove('wrong');void el.offsetWidth;el.classList.add('wrong');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('wrong'),700)};
const fmt=(n,d=0)=>Number(n).toLocaleString('el-GR',{maximumFractionDigits:d,minimumFractionDigits:d});
document.getElementById('h1').textContent=DATA.title;document.getElementById('sub').textContent=DATA.sub;
const tabs=document.getElementById('tabs'),main=document.getElementById('main');
function build(){['A','B','C'].forEach((k,ti)=>{
  if(!DATA.levels[k])return;
  const L=DATA.levels[k];
  const b=$('button',{class:'tab'+(ti===0?' active':'')},`<span class="dot" style="background:${LV[k][1]}"></span>${LV[k][0]} · ${L.tab}`);
  const p=$('section',{class:'panel'+(ti===0?' active':'')});
  b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');p.classList.add('active')};
  tabs.appendChild(b);main.appendChild(p);
  L.acts.forEach((act,ai)=>{
    const c=$('div',{class:'card'});
    c.appendChild($('h2',{},`<span class="badge" style="background:${LV[k][1]}">${LV[k][0]}${ai+1}</span>${act.title}`));
    if(act.help)c.appendChild($('p',{class:'help'},act.help));
    const body=$('div');c.appendChild(body);p.appendChild(c);
    (R[act.type]||R.calc)(body,act);
  });
});}
const R={};
// ---------- MATCH ----------
R.match=(root,act)=>{
  const init=()=>{
    root.innerHTML='';let sel=null,ok=0,err=0;const n=act.pairs.length;
    const g=$('div',{class:'grid2'}),l=$('div',{},`<b>${act.left||'Όρος'}</b>`),r=$('div',{},`<b>${act.right||'Σημαίνει'}</b>`);
    const sc=$('div',{class:'score'},`Σωστά: 0 / ${n} · Λάθη: 0`);
    const upd=()=>sc.textContent=`Σωστά: ${ok} / ${n} · Λάθη: ${err}`+(ok===n?'  🎉 Τέλεια! Γράψε το αποτέλεσμα στο φύλλο εργασίας.':'');
    shuffle(act.pairs.map((_,i)=>i)).forEach(i=>{const b=$('button',{class:'item'},act.pairs[i][0]);b.dataset.i=i;
      b.onclick=()=>{if(b.classList.contains('done'))return;l.querySelectorAll('.item').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b};l.appendChild(b)});
    shuffle(act.pairs.map((_,i)=>i)).forEach(i=>{const b=$('button',{class:'item'},act.pairs[i][1]);b.dataset.i=i;
      b.onclick=()=>{if(b.classList.contains('done'))return;if(!sel){alert('Πρώτα διάλεξε κάτι από την αριστερή στήλη.');return}
        if(sel.dataset.i===b.dataset.i){sel.className='item done';b.className='item done';ok++;sel=null}else{err++;shake(b);shake(sel)}upd()};r.appendChild(b)});
    g.append(l,r);root.append(g,sc,$('div',{},'')); const again=$('button',{class:'big ghost',onclick:init},'↺ Ξανά');root.appendChild(again);
  };init();
};
// ---------- SORT (one card at a time) ----------
R.sort=(root,act)=>{
  let deck,i,s;
  const init=()=>{deck=shuffle(act.items);i=0;s=0;draw()};
  const draw=()=>{
    root.innerHTML='';const bar=$('div',{class:'progress'},'<i></i>');bar.firstChild.style.width=(i/deck.length*100)+'%';root.appendChild(bar);
    if(i>=deck.length){root.append($('div',{class:'score'},`Τελικό σκορ: ${s} / ${deck.length}`),$('p',{},'Γράψε το σκορ στο φύλλο εργασίας.'),$('button',{class:'big ghost',onclick:init},'↺ Ξανά'));return}
    const it=deck[i];let done=false;
    root.append($('div',{class:'help'},`Κάρτα ${i+1} από ${deck.length} · Σκορ: ${s}`),$('div',{class:'flash'},it[0]));
    const cats=$('div',{class:'cats'});const ex=$('div',{class:'expl'});ex.style.display='none';const nx=$('button',{class:'big'},'Επόμενη ➜');nx.style.display='none';
    act.cats.forEach((cn,ci)=>{const b=$('button',{class:'cat'},cn);b.onclick=()=>{if(done)return;done=true;const ok=ci===it[1];if(ok)s++;
      b.style.background=ok?'#e6f6ec':'#fdeceb';b.style.borderColor=ok?'var(--ok)':'var(--bad)';
      ex.style.display='block';ex.innerHTML=(ok?'✅ Σωστά! ':'❌ Όχι. ')+`Σωστή απάντηση: <b>${act.cats[it[1]]}</b>. `+(it[2]||'');nx.style.display='inline-block'};cats.appendChild(b)});
    nx.onclick=()=>{i++;draw()};
    root.append(cats,ex,$('div',{style:'text-align:center'}));root.lastChild.appendChild(nx);
  };init();
};
// ---------- ORDER ----------
R.order=(root,act)=>{
  const init=()=>{
    root.innerHTML='';let pos=0,err=0;const n=act.steps.length;
    const built=$('ol',{class:'built'});const pool=$('div');const sc=$('div',{class:'score'},`Σωστά βήματα: 0 / ${n} · Λάθη: 0`);
    shuffle(act.steps.map((_,i)=>i)).forEach(i=>{const b=$('button',{class:'item'},act.steps[i]);
      b.onclick=()=>{if(i===pos){b.remove();built.appendChild($('li',{},act.steps[i]));pos++}else{err++;shake(b)}
        sc.textContent=`Σωστά βήματα: ${pos} / ${n} · Λάθη: ${err}`+(pos===n?'  🎉 Σωστή σειρά! Γράψε το αποτέλεσμα στο φύλλο εργασίας.':'')};pool.appendChild(b)});
    root.append($('div',{class:'grid2'}));root.firstChild.append($('div',{},'<b>Διάλεξε το επόμενο βήμα:</b>'),$('div',{},'<b>Η σειρά σου:</b>'));
    root.firstChild.firstChild.appendChild(pool);root.firstChild.lastChild.appendChild(built);
    root.append(sc,$('div'));root.lastChild.appendChild($('button',{class:'big ghost',onclick:init},'↺ Ξανά'));
  };init();
};
// ---------- MCQ ----------
R.mcq=(root,act)=>{
  let qi,s;const init=()=>{qi=0;s=0;draw()};
  const draw=()=>{
    root.innerHTML='';const bar=$('div',{class:'progress'},'<i></i>');bar.firstChild.style.width=(qi/act.qs.length*100)+'%';root.appendChild(bar);
    if(qi>=act.qs.length){root.append($('div',{class:'score'},`Τελικό σκορ: ${s} / ${act.qs.length}`),$('p',{},'Γράψε το σκορ στο φύλλο εργασίας.'),$('button',{class:'big ghost',onclick:init},'↺ Ξανά'));return}
    const Q=act.qs[qi];let done=false;
    root.append($('div',{class:'help'},`Ερώτηση ${qi+1} από ${act.qs.length} · Σκορ: ${s}`),$('div',{class:'q'},Q.q));
    const opts=shuffle(Q.o.map((t,i)=>({t,ok:i===(Q.a||0)})));const btns=[];
    const ex=$('div',{class:'expl'});ex.style.display='none';const nx=$('button',{class:'big'},'Επόμενη ➜');nx.style.display='none';
    opts.forEach((o,k)=>{const b=$('button',{class:'opt'},`${String.fromCharCode(913+k)}. ${o.t}`);btns.push([b,o]);
      b.onclick=()=>{if(done)return;done=true;if(o.ok)s++;b.classList.add(o.ok?'ok':'no');btns.forEach(([bb,oo])=>{if(oo.ok)bb.classList.add('ok')});
        ex.style.display='block';ex.innerHTML=(o.ok?'✅ Σωστά! ':'❌ Όχι ακριβώς. ')+(Q.e||'');nx.style.display='inline-block'};root.appendChild(b)});
    nx.onclick=()=>{qi++;draw()};root.append(ex,nx);
  };init();
};
// ---------- CALCULATORS ----------
const num=(v,d=0)=>{const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?d:x};
R.calc=(root,act)=>{(C[act.calc]||(()=>root.textContent='?'))(root,act)};
const C={};
function rowsTable(root,presets,defaults,cols,onChange){
  const t=$('table',{class:'calc'});t.innerHTML='<thead><tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'<th></th></tr></thead>';const tb=$('tbody');t.appendChild(tb);
  const add=(p=0,q=1,w=null)=>{const tr=$('tr');
    tr.innerHTML=`<td><select>${presets.map((x,i)=>`<option value="${i}" ${i===p?'selected':''}>${x[0]}</option>`).join('')}</select></td><td><input type="number" class="w" min="0" value="${w!==null?w:presets[p][1]}"></td><td><input type="number" class="q" min="0" value="${q}"></td><td><button class="big ghost" style="padding:3px 10px;margin:0">✕</button></td>`;
    const sel=tr.querySelector('select');sel.onchange=()=>{tr.querySelector('.w').value=presets[sel.value][1];onChange()};
    tr.querySelectorAll('input').forEach(x=>x.oninput=onChange);tr.querySelector('button').onclick=()=>{tr.remove();onChange()};tb.appendChild(tr);onChange()};
  root.appendChild(t);root.appendChild($('button',{class:'big ghost',onclick:()=>add()},'+ Πρόσθεσε γραμμή'));
  const sum=()=>{let s=0;tb.querySelectorAll('tr').forEach(tr=>s+=num(tr.querySelector('.w').value)*num(tr.querySelector('.q').value));return s};
  defaults.forEach(d=>add(...d));return {sum,tb};
}
// PSU calculator (2.4.5)
C.psu=(root)=>{
  const P=[["Επεξεργαστής (CPU)",65],["Κάρτα γραφικών (GPU)",200],["Μητρική πλακέτα",50],["Άρθρωμα μνήμης RAM",5],["Δίσκος SSD",5],["Σκληρός δίσκος HDD",8],["Οπτικός οδηγός",20],["Ανεμιστήρας θήκης",3],["Πληκτρολόγιο / ποντίκι USB",3],["Άλλη συσκευή",10]];
  const out=$('div');let T;
  const calc=()=>{if(!T)return;const S=T.sum(),m=num(mg.value,40)/100,req=S*(1+m);
    const sizes=[300,350,400,450,500,550,600,650,750,850,1000,1200,1300,1600];const s1=sizes.find(x=>x>=req)||'>1600';const s2=sizes.find(x=>x>s1)||s1;
    out.innerHTML=`<div class="res"><div class="stat">Άθροισμα συσκευών<b>${fmt(S)} W</b></div><div class="stat">+ ${fmt(m*100)}% περιθώριο<b>${fmt(req)} W</b></div><div class="stat">Ελάχιστο τροφοδοτικό<b>${s1} W</b></div><div class="stat">Με πρόβλεψη αναβάθμισης<b>${s2} W</b></div></div>
    <div class="note">Τύπος του βιβλίου: <b>Απαιτούμενη ισχύς = Άθροισμα + (20%–40%)</b>, γιατί τα τροφοδοτικά αποδίδουν καλύτερα στο 60%–80% της μέγιστης ισχύος τους. Παράδειγμα βιβλίου: 300 W → 300 + 120 = 420 W → επιλογή 500–550 W.</div>`};
  const mg=$('select');[20,30,40].forEach(v=>mg.appendChild($('option',{value:v},v+'%')));mg.value=40;mg.onchange=calc;
  T=rowsTable(root,P,[[0,1],[1,1],[2,1],[3,2],[4,1],[5,1],[7,3]],['Συσκευή','Ισχύς (W)','Πλήθος'],calc);
  const p=$('p',{},'Περιθώριο ασφαλείας: ');p.appendChild(mg);root.append(p,out);calc();
  // efficiency
  const e=$('div',{class:'card',style:'box-shadow:none;background:var(--soft);margin-top:16px'});
  e.innerHTML=`<b>Απόδοση και θερμότητα</b><p class="help">Πόση ενέργεια χάνεται σε θερμότητα;</p>
  Ισχύς εξόδου (W): <input type="number" id="eo" value="400"> &nbsp; Απόδοση (%): <input type="number" id="ee" value="85"> &nbsp; Ώρες/ημέρα: <input type="number" id="eh" value="8"> &nbsp; Τιμή ρεύματος (€/kWh): <input type="number" id="ep" value="0.20" step="0.01">
  <div class="res" id="er"></div>`;
  root.appendChild(e);
  const ec=()=>{const o=num(e.querySelector('#eo').value),ef=num(e.querySelector('#ee').value,85)/100,h=num(e.querySelector('#eh').value),pr=num(e.querySelector('#ep').value);
    const inp=o/ef,loss=inp-o,kwh=inp*h*365/1000;
    e.querySelector('#er').innerHTML=`<div class="stat">Τραβάει από την πρίζα<b>${fmt(inp)} W</b></div><div class="stat">Χάνεται σε θερμότητα<b>${fmt(loss)} W</b></div><div class="stat">Κόστος ρεύματος / έτος<b>${fmt(kwh*pr,2)} €</b></div>`};
  e.querySelectorAll('input').forEach(x=>x.oninput=ec);ec();
};
// Temperature / heat converter (2.5.1)
C.temp=(root)=>{
  root.innerHTML=`<p>°C → °F: <input type="number" id="c" value="90"> °C = <b id="f1"></b> °F &nbsp;&nbsp; | &nbsp;&nbsp; °F → °C: <input type="number" id="f" value="86"> °F = <b id="c1"></b> °C</p>
  <p>kcal → joule / Btu: <input type="number" id="k" value="1"> kcal = <b id="j"></b> J = <b id="bt"></b> Btu</p>
  <div class="note">Τύποι του βιβλίου: <b>F = 1,8·C + 32</b> · <b>C = (F − 32) / 1,8</b> · <b>1 kcal = 4186,8 J = 3,968 Btu</b></div>
  <hr style="border:none;border-top:1px solid var(--line);margin:16px 0">
  <b>Είναι κατάλληλη η θερμοκρασία του χώρου;</b><p>Εποχή: <select id="se"><option value="w">Χειμώνας</option><option value="s">Καλοκαίρι</option></select> &nbsp; Θερμοκρασία δωματίου: <input type="number" id="rt" value="27"> °C</p><div id="rr" class="note"></div>`;
  const q=s=>root.querySelector(s);
  const up=()=>{q('#f1').textContent=fmt(1.8*num(q('#c').value)+32,1);q('#c1').textContent=fmt((num(q('#f').value)-32)/1.8,1);
    const k=num(q('#k').value);q('#j').textContent=fmt(k*4186.8,1);q('#bt').textContent=fmt(k*3.968,3);
    const lim=q('#se').value==='w'?20:30,t=num(q('#rt').value);
    q('#rr').innerHTML=t<=lim?`<span class="ok-t">✔ Εντάξει.</span> Το βιβλίο προτείνει έως ${lim} °C ${q('#se').value==='w'?'τον χειμώνα':'το καλοκαίρι'}.`:`<span class="no-t">✖ Πολύ ζεστά!</span> Το βιβλίο προτείνει έως ${lim} °C. Χρειάζεται κλιματισμός ή άλλη θέση για τον υπολογιστή.`};
  root.querySelectorAll('input,select').forEach(x=>x.oninput=x.onchange=up);up();
};
// RAM name converter (2.6.5)
C.ram=(root)=>{
  root.innerHTML=`<p><b>DDR → PC-Rating</b>: Γενιά <select id="g"><option value="">DDR</option><option value="2">DDR2</option><option value="3" selected>DDR3</option><option value="4">DDR4</option><option value="5">DDR5</option></select>
  – συχνότητα (MHz) <input type="number" id="mhz" value="1600"> → <b id="pc" style="font-size:22px;color:var(--acc)"></b></p>
  <p><b>PC-Rating → DDR</b>: PC<select id="g2"><option value="">(DDR)</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option></select>-<input type="number" id="rate" value="10600"> → <b id="ddr" style="font-size:22px;color:var(--acc)"></b></p>
  <div class="note">Κανόνας του βιβλίου: <b>PC-Rating = συχνότητα × 8</b> (64 bit ÷ 8 = 8 byte). Π.χ. DDR2-800 → 800 × 8 = 6400 → PC2-6400. Οι επίσημες ονομασίες στρογγυλεύονται (π.χ. DDR3-1066 → PC3-8500).</div>
  <table class="calc" style="margin-top:12px"><tr><th>Τύπος</th><th>Επαφές</th><th>Τάση</th></tr><tr><td>SDR</td><td>168</td><td>3,3 V</td></tr><tr><td>DDR</td><td>184</td><td>2,5 V</td></tr><tr><td>DDR2</td><td>240</td><td>1,8 V</td></tr><tr><td>DDR3</td><td>240</td><td>1,5 V</td></tr><tr><td>DDR4</td><td>288</td><td>1,2 V</td></tr><tr><td>DDR5 <small>(σημερινή γενιά – δεν είναι στο βιβλίο)</small></td><td>288</td><td>1,1 V</td></tr></table>`;
  const q=s=>root.querySelector(s);
  const up=()=>{const g=q('#g').value,m=num(q('#mhz').value);q('#pc').textContent=`DDR${g}-${m} = PC${g}-${m*8}`;
    const g2=q('#g2').value,r=num(q('#rate').value),raw=r/8;const STD={'':[200,266,333,400],'2':[400,533,667,800,1066],'3':[800,1066,1333,1600,1866,2133,2400],'4':[1600,1866,2133,2400,2666,2933,3200],'5':[4800,5200,5600,6000,6400,7200,8000]}[g2];const near=STD.reduce((a,b)=>Math.abs(b-raw)<Math.abs(a-raw)?b:a);q('#ddr').textContent=`PC${g2}-${r} → ${r} ÷ 8 = ${fmt(raw,1)} → DDR${g2}-${near}`};
  root.querySelectorAll('input,select').forEach(x=>x.oninput=x.onchange=up);up();
};
// Storage calculator (2.7)
C.storage=(root)=>{
  root.innerHTML=`<b>1. Πόσοι δίσκοι χρειάζονται;</b><p>Δεδομένα για αντίγραφο ασφαλείας: <input type="number" id="gb" value="120"> GB</p><div class="res" id="disks"></div>
  <hr style="border:none;border-top:1px solid var(--line);margin:16px 0">
  <b>2. Πόση ώρα θα πάρει η αντιγραφή;</b><p>Μέγεθος: <input type="number" id="tg" value="50"> GB &nbsp; Ταχύτητα: <input type="number" id="sp" value="100"> MB/s <small>(βάλε την ταχύτητα που βρήκες στην έρευνά σου)</small></p><div class="res" id="tt"></div>
  <hr style="border:none;border-top:1px solid var(--line);margin:16px 0">
  <b>3. Τιμή ανά GB</b><table class="calc"><tr><th>Μονάδα</th><th>Χωρητικότητα (GB)</th><th>Τιμή (€)</th><th>€ / GB</th></tr>
  ${['Σκληρός δίσκος HDD','SSD SATA','SSD NVMe M.2'].map((n,i)=>`<tr><td>${n}</td><td><input type="number" class="c" value="${[2000,1000,1000][i]}"></td><td><input type="number" class="p" value="0"></td><td class="r">–</td></tr>`).join('')}</table>
  <div class="note">Χωρητικότητες του βιβλίου: CD έως 800 MB · DVD 4,7 GB (8,5 GB διπλού επιπέδου) · Blu-ray 25 / 50 / 100 / 128 GB. Εδώ 1 GB = 1000 MB.</div>`;
  const q=s=>root.querySelector(s);
  const up=()=>{const g=num(q('#gb').value);
    q('#disks').innerHTML=[['CD (0,8 GB)',.8],['DVD (4,7 GB)',4.7],['DVD DL (8,5 GB)',8.5],['Blu-ray (25 GB)',25],['Blu-ray (50 GB)',50],['Blu-ray (128 GB)',128]].map(([n,c])=>`<div class="stat">${n}<b>${Math.ceil(g/c)}</b></div>`).join('');
    const sec=num(q('#tg').value)*1000/Math.max(num(q('#sp').value,1),0.001);
    q('#tt').innerHTML=`<div class="stat">Χρόνος<b>${sec<60?fmt(sec)+' δευτ.':sec<3600?fmt(sec/60,1)+' λεπτά':fmt(sec/3600,2)+' ώρες'}</b></div>`;
    root.querySelectorAll('table.calc tr').forEach((tr,i)=>{if(!i)return;const c=num(tr.querySelector('.c').value),p=num(tr.querySelector('.p').value);tr.querySelector('.r').textContent=p>0&&c>0?fmt(p/c,3)+' €':'–'})};
  root.querySelectorAll('input').forEach(x=>x.oninput=up);up();
};
// Case fit checker (2.3.2)
C.casefit=(root)=>{
  root.innerHTML=`<div class="grid2"><div><b>Προδιαγραφές θήκης</b> <small>(παράδειγμα του βιβλίου)</small>
  <table class="calc"><tr><td>Μέγ. μήκος κάρτας γραφικών (mm)</td><td><input type="number" id="cg" value="420"></td></tr>
  <tr><td>Μέγ. ύψος ψύκτρας CPU (mm)</td><td><input type="number" id="cc" value="170"></td></tr>
  <tr><td>Μητρικές που δέχεται</td><td><label><input type="checkbox" id="cATX" checked> ATX</label><br><label><input type="checkbox" id="cmATX" checked> micro ATX</label><br><label><input type="checkbox" id="cITX"> mini ITX</label></td></tr>
  <tr><td>Θέσεις 3,5″</td><td><input type="number" id="c35" value="7"></td></tr>
  <tr><td>Θέσεις 2,5″</td><td><input type="number" id="c25" value="9"></td></tr>
  <tr><td>Θέσεις 5,25″</td><td><input type="number" id="c52" value="3"></td></tr>
  <tr><td>Ύψος θήκης (εκ.)</td><td><input type="number" id="ch" value="51"></td></tr></table></div>
  <div><b>Τα εξαρτήματα που θέλω να βάλω</b><table class="calc"><tr><td>Μήκος κάρτας γραφικών (mm)</td><td><input type="number" id="pg" value="336"></td></tr>
  <tr><td>Ύψος ψύκτρας CPU (mm)</td><td><input type="number" id="pc" value="158"></td></tr>
  <tr><td>Μητρική</td><td><select id="pm"><option>ATX</option><option>micro ATX</option><option>mini ITX</option></select></td></tr>
  <tr><td>Δίσκοι 3,5″</td><td><input type="number" id="p35" value="3"></td></tr>
  <tr><td>Δίσκοι 2,5″</td><td><input type="number" id="p25" value="1"></td></tr>
  <tr><td>Μονάδες 5,25″ (DVD)</td><td><input type="number" id="p52" value="1"></td></tr></table></div></div>
  <div id="fit" class="res"></div><div id="cat" class="note"></div>`;
  const q=s=>root.querySelector(s);
  const up=()=>{const m={ 'ATX':'#cATX','micro ATX':'#cmATX','mini ITX':'#cITX'}[q('#pm').value];
    const checks=[['Κάρτα γραφικών',num(q('#pg').value)<=num(q('#cg').value)],['Ψύκτρα CPU',num(q('#pc').value)<=num(q('#cc').value)],['Μητρική',q(m).checked],['Δίσκοι 3,5″',num(q('#p35').value)<=num(q('#c35').value)],['Δίσκοι 2,5″',num(q('#p25').value)<=num(q('#c25').value)],['Μονάδες 5,25″',num(q('#p52').value)<=num(q('#c52').value)]];
    q('#fit').innerHTML=checks.map(([n,ok])=>`<div class="stat">${n}<b class="${ok?'ok-t':'no-t'}" style="font-size:22px">${ok?'✔ Χωράει':'✖ Δεν χωράει'}</b></div>`).join('');
    const h=num(q('#ch').value);q('#cat').innerHTML='Κατηγορία θήκης με βάση το ύψος (βιβλίο): <b>'+(h>60?'Full Tower (πάνω από 60 εκ.)':h>=45?'Mid Tower (περίπου 45–60 εκ.)':h>=35?'Mini Tower (35–45 εκ.)':'Μικρότερη θήκη (π.χ. Desktop / HTPC)')+'</b>'};
  root.querySelectorAll('input,select').forEach(x=>x.oninput=x.onchange=up);up();
};
// Labor cost (2.2.4 – τιμολόγηση)
C.labor=(root)=>{
  const P=[["Άνοιγμα θήκης & φωτογράφιση",5],["Αφαίρεση καρτών επέκτασης",5],["Αποσύνδεση καλωδίων",5],["Αφαίρεση τροφοδοτικού",5],["Αφαίρεση μητρικής",10],["Αφαίρεση δίσκων",5],["Καθαρισμός",15],["Συναρμολόγηση",30],["Έλεγχος λειτουργίας",10],["Άλλη εργασία",10]];
  const out=$('div');let T;
  const calc=()=>{if(!T)return;const min=T.sum(),rate=num(r.value,30),vat=num(v.value,24)/100,net=min/60*rate;
    out.innerHTML=`<div class="res"><div class="stat">Συνολικός χρόνος<b>${fmt(min)} λεπτά</b></div><div class="stat">Κόστος εργασίας<b>${fmt(net,2)} €</b></div><div class="stat">Με ΦΠΑ<b>${fmt(net*(1+vat),2)} €</b></div></div>`};
  const r=$('input',{type:'number',value:30}),v=$('input',{type:'number',value:24});
  T=rowsTable(root,P,[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[7,1],[8,1]],['Εργασία','Λεπτά','Φορές'],calc);
  const p=$('p',{},'Χρέωση ανά ώρα (€): ');p.appendChild(r);p.append(' ΦΠΑ (%): ');p.appendChild(v);r.oninput=v.oninput=calc;root.append(p,out);calc();
  root.appendChild($('div',{class:'note'},'Βάλε τους χρόνους που μέτρησε η ομάδα σου ή τους χρόνους από το βίντεο που είδες. Η διάρκεια κάθε εργασίας χρειάζεται για την τιμολόγηση (βιβλίο, 2.2.4).'));
};
build();
</script>
