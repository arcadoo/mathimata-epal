<!DOCTYPE html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Προσομοιωτής κλήσεων Help Desk</title>
<style>
:root{--dark:#0F1B2D;--dark2:#1B2A41;--green:#16A34A;--g2:#22C55E;--amber:#F59E0B;--red:#DC2626;--light:#F4F6F9;--ink:#1E293B;--muted:#64748B}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Calibri,Arial,sans-serif;background:var(--light);color:var(--ink);font-size:19px}
header{background:var(--dark);color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{margin:0;font-size:24px}header .sc{font-size:18px;color:#CBD5E1}header .sc b{color:var(--g2);font-size:22px}
main{max-width:900px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:24px;margin-bottom:18px}
.calls{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.call{cursor:pointer;border:2px solid transparent}.call:hover{border-color:var(--g2)}
.call h3{margin:.2em 0}.tag{display:inline-block;font-size:14px;font-weight:700;padding:3px 10px;border-radius:20px;background:#DCFCE7;color:#166534}
.tag.hard{background:#FEE2E2;color:#991B1B}.tag.mid{background:#FEF3C7;color:#92400E}
.bubble{background:var(--dark2);color:#fff;border-radius:14px 14px 14px 2px;padding:16px 20px;margin:10px 0 18px;font-size:20px;line-height:1.45}
.who{font-size:15px;color:var(--muted);font-weight:700}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #CBD5E1;border-radius:12px;padding:14px 18px;margin:10px 0;font-size:18px;cursor:pointer;font-family:inherit;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--green);background:#F0FDF4}
.opt:disabled{cursor:default}.opt.good{border-color:var(--green);background:#DCFCE7}.opt.mid{border-color:var(--amber);background:#FEF3C7}.opt.bad{border-color:var(--red);background:#FEE2E2}
.fb{border-radius:12px;padding:14px 18px;margin-top:8px;font-size:17px;line-height:1.45}
.fb.good{background:#DCFCE7}.fb.mid{background:#FEF3C7}.fb.bad{background:#FEE2E2}
.btn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:18px;cursor:pointer;font-family:inherit;margin-top:14px}
.btn.sec{background:#475569}
.progress{height:8px;background:#E2E8F0;border-radius:4px;margin-bottom:14px}.progress div{height:8px;background:var(--g2);border-radius:4px}
.big{font-size:56px;font-weight:800;color:var(--green)}
ul.rules li{margin:6px 0}
</style></head><body>
<header><h1>📞 Προσομοιωτής κλήσεων Help Desk</h1><div class="sc">Συνολικοί πόντοι: <b id="total">0</b></div></header>
<main id="app"></main>
<script>
const CALLS=[
{title:"Κλήση 1 · Η κυρία Ελένη",level:"Εύκολη",cls:"",desc:"Αρχάρια χρήστρια. Ο εκτυπωτής δεν τυπώνει και βιάζεται.",steps:[
 {say:"Καλησπέρα… Δεν ξέρω τι έκανα! Ο εκτυπωτής δεν τυπώνει και πρέπει να στείλω ένα έγγραφο σε μισή ώρα!",opts:[
  ["Καλησπέρα κυρία Ελένη, είμαι από την τεχνική υποστήριξη. Μην ανησυχείτε, θα το δούμε μαζί. Πείτε μου τι ακριβώς γίνεται όταν πατάτε «Εκτύπωση»;",10,"Σωστά! Ευγενική σύσταση, ηρεμία και μια ανοιχτή ερώτηση για να περιγράψει το πρόβλημα. Η υποστήριξη «ξεκινά με την καταγραφή του προβλήματος σύμφωνα με την περιγραφή του χρήστη» (σελ. 7)."],
  ["Τι του κάνατε;",0,"Ποτέ δεν κατηγορούμε τον πελάτη (σελ. 11). Θα αμυνθεί και δεν θα μας δώσει σωστές πληροφορίες."],
  ["Θα έχει κολλήσει ο spooler. Κάντε restart το service.",3,"Τεχνικοί όροι που η πελάτισσα δεν καταλαβαίνει. Αποφεύγουμε ορολογία και αργκό (σελ. 9)."]]},
 {say:"Πατάω εκτύπωση και… δεν γίνεται τίποτα. Α, και βγαίνει ένα κίτρινο θαυμαστικό κάτω δεξιά.",opts:[
  ["Αν κατάλαβα σωστά: πατάτε «Εκτύπωση», δεν βγαίνει χαρτί και εμφανίζεται ένα κίτρινο σύμβολο κάτω δεξιά στην οθόνη. Σωστά;",10,"Τέλεια! Επαναλαμβάνουμε το πρόβλημα με δικά μας λόγια («αν κατάλαβα σωστά») για να βεβαιωθούμε ότι καταλάβαμε (σελ. 9–10)."],
  ["Εντάξει, εντάξει, κατάλαβα.",2,"Βιαστική απάντηση. Ακούμε προσεκτικά χωρίς να διακόπτουμε (σελ. 9) και επιβεβαιώνουμε ότι καταλάβαμε."],
  ["Το θαυμαστικό δεν σημαίνει τίποτα, αγνοήστε το.",0,"Δεν υποβαθμίζουμε ό,τι λέει ο πελάτης (σελ. 9). Συχνά η «ασήμαντη» λεπτομέρεια είναι το κλειδί."]]},
 {say:"Ναι, ακριβώς έτσι.",opts:[
  ["Θα σας πω βήματα ένα-ένα. Πρώτο βήμα: κοιτάξτε τον εκτυπωτή. Έχει κάποιο φωτάκι αναμμένο;",10,"Σωστά! Ένα βήμα τη φορά, με απλή γλώσσα. Ξεκινάμε από τον πιο απλό έλεγχο."],
  ["Ανοίξτε Πίνακα Ελέγχου, Συσκευές και Εκτυπωτές, δεξί κλικ, Εμφάνιση εργασιών, Ακύρωση όλων, μετά Ρυθμίσεις θύρας…",3,"Πάρα πολλά βήματα μαζί για αρχάρια χρήστρια. Δίνουμε αριθμημένα βήματα, ένα-ένα (σελ. 10)."],
  ["Θα περάσω την επόμενη εβδομάδα να το δω.",0,"Η πελάτισσα βιάζεται. Πρέπει να καθορίσουμε και να τηρήσουμε ρεαλιστικό χρόνο (σελ. 9). Εδώ μπορούμε να βοηθήσουμε αμέσως."]]},
 {say:"Όχι! Είναι όλο σβηστό… Α! Το καλώδιο ρεύματος είχε βγει από την πρίζα. Το έβαλα, τώρα ανάβει και τυπώνει!",opts:[
  ["Τέλεια! Τυπώθηκε σωστά το έγγραφό σας; Αν ξανασυμβεί, ελέγξτε πρώτα το φωτάκι. Θα καταγράψω το περιστατικό. Χρειάζεστε κάτι άλλο;",10,"Εξαιρετικά! Ελέγχουμε ότι το σύστημα λειτουργεί, καταγράφουμε το περιστατικό (βήματα 4 και 5, σελ. 8) και «εκπαιδεύουμε» τον χρήστη για την επόμενη φορά (σελ. 10)."],
  ["Εντάξει, γεια σας.",3,"Κλείσαμε χωρίς να ελέγξουμε ότι δουλεύει και χωρίς καταγραφή."],
  ["Δηλαδή με πήρατε τηλέφωνο για ένα καλώδιο;",0,"Επαγγελματίας αλλά όχι ψυχρός. Φερόμαστε όπως θα θέλαμε να μας φερθούν σε κάτι που δεν ξέρουμε (σελ. 11)."]]}]},
{title:"Κλήση 2 · Ο κύριος Νίκος",level:"Μέτρια",cls:"mid",desc:"Λογιστικό γραφείο. Τα email του δεν φεύγουν.",steps:[
 {say:"Καλησπέρα. Από το πρωί δεν φεύγουν τα email μου. Είναι επείγον, περιμένουν πελάτες!",opts:[
  ["Καλησπέρα κύριε Νίκο. Καταλαβαίνω ότι είναι επείγον. Εμφανίζεται κάποιο μήνυμα όταν πατάτε «Αποστολή»;",10,"Σωστά! Δείχνουμε κατανόηση και ζητάμε το μήνυμα λάθους, που συνήθως μας δείχνει την αιτία (σελ. 10)."],
  ["Σε εμάς όλα δουλεύουν, το πρόβλημα θα είναι δικό σας.",0,"Αμυντική στάση και κατηγορία. Ποτέ δεν επιρρίπτουμε ευθύνες στον πελάτη (σελ. 11)."],
  ["Περιμένετε λίγο… (τον αφήνετε σε αναμονή 5 λεπτά χωρίς εξήγηση)",2,"Ενημερώνουμε πάντα τον πελάτη τι κάνουμε και πόσο θα διαρκέσει."]]},
 {say:"Γράφει κάτι στα αγγλικά… «mailbox full» ή κάτι τέτοιο.",opts:[
  ["Μπορείτε να μου διαβάσετε όλο το μήνυμα, λέξη προς λέξη;",10,"Σωστά! Ζητάμε το ακριβές μήνυμα. Το «κάτι τέτοιο» δεν αρκεί για σωστή διάγνωση."],
  ["Αφού είναι στα αγγλικά, δεν πειράζει.",0,"Το μήνυμα λάθους είναι η πιο πολύτιμη πληροφορία. Πολλές σελίδες βοήθειας είναι στα αγγλικά (σελ. 14)."],
  ["Mailbox full σημαίνει quota exceeded στον IMAP server σας.",3,"Σωστή διάγνωση, αλλά γεμάτη ορολογία που ο πελάτης δεν καταλαβαίνει."]]},
 {say:"«Your mailbox is full. You cannot send or receive items.»",opts:[
  ["Ευχαριστώ! Σημαίνει ότι γέμισε ο χώρος για τα email σας, σαν ένα ντουλάπι που δεν χωράει άλλα. Θα αδειάσουμε μαζί τα «Διαγραμμένα». Βήμα 1: πατήστε στον φάκελο «Διαγραμμένα» αριστερά.",10,"Εξαιρετικά! Εξήγηση με απλή αναλογία, βήματα ένα-ένα και ονόματα κουμπιών μέσα σε «εισαγωγικά» (σελ. 10)."],
  ["Σβήστε τα email σας.",2,"Ασαφές και επικίνδυνο. Ποια email; Ίσως σβήσει σημαντικά μηνύματα πελατών."],
  ["Χρειάζεστε μεγαλύτερο πακέτο, κοστίζει 5 € τον μήνα.",3,"Μπορεί να χρειαστεί αργότερα, αλλά πρώτα λύνουμε το επείγον πρόβλημα. Προτείνουμε επιλογές, δεν πιέζουμε (σελ. 9)."]]},
 {say:"Τα άδειασα… Ναι! Έφυγε το μήνυμα!",opts:[
  ["Τέλεια! Θα σας στείλω με email σύντομες οδηγίες, και την επόμενη εβδομάδα θα ρυθμίσουμε αυτόματη αρχειοθέτηση για να μην ξαναγεμίσει.",10,"Σωστά! Γραπτή τεκμηρίωση και πρόληψη ώστε να μην ξανασυμβεί. Αυτό κάνει ένας επαγγελματίας."],
  ["Ωραία, αντίο.",3,"Λύθηκε, αλλά θα ξαναγεμίσει σε λίγες εβδομάδες. Χάσαμε την ευκαιρία να το προλάβουμε."],
  ["Την άλλη φορά να προσέχετε.",0,"Δεν κάνουμε κήρυγμα στον πελάτη. Είμαστε επαγγελματίες αλλά όχι ψυχροί (σελ. 11)."]]}]},
{title:"Κλήση 3 · Ο κύριος Βασίλης",level:"Δύσκολη",cls:"hard",desc:"Θυμωμένος πελάτης που παίρνει τρίτη φορά.",steps:[
 {say:"Τρίτη φορά σας παίρνω! Ο υπολογιστής είναι σκουπίδι, όλο κολλάει! Τι πληρώνω τόσο καιρό;",opts:[
  ["Έχετε δίκιο που είστε αναστατωμένος, κύριε Βασίλη. Βλέπω τις προηγούμενες κλήσεις σας στο σύστημα και θα το λύσουμε. Πείτε μου τι γίνεται αυτή τη φορά;",10,"Σωστά! Ενσυναίσθηση, χωρίς άμυνα. Η καταγραφή των προηγούμενων κλήσεων μάς βοηθά (σελ. 8)."],
  ["Δεν χρειάζεται να φωνάζετε. Δεν φταίω εγώ.",0,"«Μην διαφωνείτε και μην είστε αμυντικοί» (σελ. 9). Ο θυμός του θα μεγαλώσει."],
  ["Ο υπολογιστής σας είναι παλιός, γι' αυτό.",2,"Κρίνουμε χωρίς να ξέρουμε ακόμη το πρόβλημα. Δεν είμαστε επικριτικοί (σελ. 9)."]]},
 {say:"Κολλάει κάθε πρωί! Και το πρόγραμμα με τα τιμολόγια αργεί πολύ να ανοίξει.",opts:[
  ["Συμβαίνει μόνο το πρωί ή και αργότερα μέσα στη μέρα; Εμφανίζεται κάτι στην οθόνη εκείνη την ώρα;",10,"Σωστά! Διευκρινιστικές ερωτήσεις για να εντοπίσουμε το πρόβλημα (βήμα 1, σελ. 8)."],
  ["Κάντε επανεκκίνηση και θα φτιάξει.",3,"Γρήγορη «λύση» χωρίς διάγνωση. Κάλεσε τρίτη φορά, άρα η επανεκκίνηση δεν έλυσε τίποτα."],
  ["«Ναι… ναι…» (την ίδια ώρα απαντάτε σε μήνυμα στο κινητό)",0,"Αποφεύγουμε τους περισπασμούς όσο εξυπηρετούμε πελάτη (σελ. 9). Ο πελάτης το καταλαβαίνει."]]},
 {say:"Μόνο το πρωί. Βγαίνει κάτι που λέει ότι κάνει ενημερώσεις…",opts:[
  ["Αν κατάλαβα σωστά, κολλάει το πρωί όταν τρέχουν οι ενημερώσεις. Με την άδειά σας, θα συνδεθώ απομακρυσμένα και θα ρυθμίσω τις ενημερώσεις να γίνονται το βράδυ.",10,"Εξαιρετικά! Επιβεβαίωση, απομακρυσμένη υποστήριξη (γρήγορη και φθηνή, σελ. 8) και ζητάμε άδεια πριν συνδεθούμε."],
  ["Κλείστε τις ενημερώσεις για πάντα.",0,"Επικίνδυνο! Οι ενημερώσεις κλείνουν κενά ασφαλείας. Λύνουμε το πρόβλημα χωρίς να δημιουργούμε άλλο."],
  ["Θα σας στείλουμε τεχνικό. Η επίσκεψη κοστίζει 60 €.",3,"Επιτόπια επίσκεψη για κάτι που λύνεται απομακρυσμένα σε 5 λεπτά. Επιλέγουμε τον κατάλληλο τρόπο υποστήριξης."]]},
 {say:"Εντάξει… Κι αν ξαναγίνει;",opts:[
  ["Θα σας τηλεφωνήσω μεθαύριο το πρωί να δούμε ότι όλα πάνε καλά. Για επείγον, έχετε το κινητό του υπευθύνου, όπως προβλέπει το συμβόλαιό σας.",10,"Σωστά! Παρακολούθηση για να βεβαιωθούμε ότι ο πελάτης είναι ικανοποιημένος (σελ. 9) και αναφορά στο συμβόλαιο (σελ. 15–16)."],
  ["Θα ξαναπάρετε τηλέφωνο.",3,"Ο πελάτης έχει ήδη πάρει τρεις φορές. Δείχνουμε ότι τον παρακολουθούμε εμείς."],
  ["Δεν θα ξαναγίνει, σας το εγγυώμαι.",2,"Δεν δίνουμε υποσχέσεις που δεν ξέρουμε αν μπορούμε να τηρήσουμε. Θέτουμε ρεαλιστικές προσδοκίες (σελ. 9)."]]}]}
];
let total=0, done={};
const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function home(){
 let h='<div class="card"><h2 style="margin-top:0">Είσαι τεχνικός στο Help Desk.</h2><p>Διάλεξε μια κλήση. Σε κάθε βήμα ο πελάτης λέει κάτι και εσύ διαλέγεις τι θα απαντήσεις. Η καλύτερη απάντηση παίρνει 10 πόντους.</p><p style="color:#64748B;font-size:16px">Διάβασε και τα σχόλια μετά από κάθε απάντηση: εκεί είναι οι κανόνες του βιβλίου (σελ. 9–11).</p></div><div class="calls">';
 CALLS.forEach((c,i)=>{h+=`<div class="card call" onclick="play(${i})"><span class="tag ${c.cls}">${c.level}</span><h3>${c.title}</h3><div style="color:#64748B;font-size:17px">${c.desc}</div>${done[i]!=null?`<p style="margin-bottom:0"><b>Βαθμός: ${done[i]}/40</b></p>`:''}</div>`});
 app.innerHTML=h+'</div>';
}
function play(ci){
 const c=CALLS[ci];let si=0,score=0;
 function step(){
  if(si>=c.steps.length){return finish()}
  const s=c.steps[si];const opts=shuffle(s.opts);
  let h=`<div class="card"><div class="progress"><div style="width:${si/c.steps.length*100}%"></div></div><div class="who">${c.title} · Βήμα ${si+1} από ${c.steps.length}</div><div class="bubble">«${s.say}»</div><div class="who">Τι απαντάς;</div><div id="opts"></div><div id="fb"></div></div>`;
  app.innerHTML=h;const box=document.getElementById('opts');
  opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent='«'+o[0]+'»';b.onclick=()=>choose(o,b);box.appendChild(b)});
  function choose(o,b){
   box.querySelectorAll('button').forEach(x=>x.disabled=true);
   const cl=o[1]>=10?'good':o[1]>=3?'mid':'bad';b.classList.add(cl);
   score+=o[1];
   document.getElementById('fb').innerHTML=`<div class="fb ${cl}"><b>${o[1]>=10?'✔ Πολύ καλά':o[1]>=3?'≈ Όχι το καλύτερο':'✘ Προσοχή'} (+${o[1]})</b><br>${o[2]}</div><button class="btn" id="nx">Συνέχεια →</button>`;
   document.getElementById('nx').onclick=()=>{si++;step()};
  }
 }
 function finish(){
  const best=done[ci]==null?score:Math.max(done[ci],score);
  total+= done[ci]==null?score:Math.max(0,score-done[ci]);done[ci]=best;
  document.getElementById('total').textContent=total;
  const msg=score>=36?'Επαγγελματίας Help Desk! 🏆':score>=25?'Καλή δουλειά. Διάβασε τα σχόλια και ξαναπροσπάθησε.':'Ξαναδοκίμασε. Πρόσεξε τους κανόνες επικοινωνίας.';
  app.innerHTML=`<div class="card" style="text-align:center"><div class="who">${c.title}</div><div class="big">${score}/40</div><p style="font-size:22px">${msg}</p><p style="color:#64748B">Γράψε τον βαθμό σου στο φύλλο εργασίας.</p><button class="btn" onclick="play(${ci})">Ξανά την ίδια κλήση</button> <button class="btn sec" onclick="home()">Όλες οι κλήσεις</button></div>`;
 }
 step();
}
home();
</script></body></html>
