<!DOCTYPE html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Κουίζ Κεφαλαίου 1</title>
<style>
:root{--dark:#0F1B2D;--green:#16A34A;--g2:#22C55E;--red:#DC2626;--light:#F4F6F9;--ink:#1E293B;--muted:#64748B}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Calibri,Arial,sans-serif;background:var(--light);color:var(--ink);font-size:19px}
header{background:var(--dark);color:#fff;padding:18px 28px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}header h1{margin:0;font-size:24px}header span{color:#CBD5E1}header b{color:var(--g2)}
main{max-width:860px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:26px}
.progress{height:8px;background:#E2E8F0;border-radius:4px;margin-bottom:16px}.progress div{height:8px;background:var(--g2);border-radius:4px}
.q{font-size:23px;font-weight:700;margin:6px 0 16px;line-height:1.35}.meta{color:var(--muted);font-size:15px;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #CBD5E1;border-radius:12px;padding:13px 18px;margin:10px 0;font-size:18px;cursor:pointer;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--green)}.opt:disabled{cursor:default}.opt.ok{border-color:var(--green);background:#DCFCE7}.opt.no{border-color:var(--red);background:#FEE2E2}
.fb{background:#F1F5F9;border-radius:12px;padding:14px 18px;margin-top:12px;font-size:17px}
.btn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px 24px;font-size:18px;cursor:pointer;font-family:inherit;margin-top:14px}
.big{font-size:64px;font-weight:800;color:var(--green);text-align:center}
</style></head><body>
<header><h1>🧠 Κουίζ · Κεφάλαιο 1 · Τρόποι και μεθοδολογία τεχνικής υποστήριξης</h1><span>Σκορ: <b id="sc">0</b></span></header>
<main><div class="card" id="app"></div></main>
<script>
const Q=[
["Τι είναι «Υπολογιστικό Σύστημα» σύμφωνα με το βιβλίο;",["Μια πλήρης υπολογιστική συσκευή που περιλαμβάνει υλικό και λογισμικό","Μόνο το κουτί του υπολογιστή","Μόνο το λειτουργικό σύστημα","Ένα δίκτυο υπολογιστών"],0,"Σελ. 7: υλικό + λογισμικό μαζί, που εξυπηρετούν συγκεκριμένες ανάγκες του χρήστη."],
["Ποιο από τα παρακάτω είναι ΛΟΓΙΣΜΙΚΟ;",["Κάρτα γραφικών","Τροφοδοτικό","Windows 11","Μνήμη RAM"],2,"Τα Windows είναι λειτουργικό σύστημα, δηλαδή λογισμικό. Τα υπόλοιπα είναι υλικό."],
["Ένας υπερυπολογιστής, ένα laptop και ένα κινητό τηλέφωνο είναι…",["Όλα υπολογιστικά συστήματα","Μόνο το laptop είναι υπολογιστικό σύστημα","Μόνο ο υπερυπολογιστής","Κανένα"],0,"Σελ. 7: ο όρος καλύπτει από υπερυπολογιστές μέχρι κινητές συσκευές."],
["Με ποιους τρόπους αναφέρει συνήθως ο χρήστης ένα πρόβλημα;",["Τηλέφωνο, email, φόρμα καταγραφής προβλήματος","Μόνο με επίσκεψη στο κατάστημα","Μόνο με ταχυδρομείο","Με SMS στον κατασκευαστή"],0,"Σελ. 8: τηλέφωνο, μήνυμα ηλεκτρονικού ταχυδρομείου ή φόρμα καταγραφής."],
["Ποιο είναι το ΠΡΩΤΟ βήμα του τεχνικού μετά την καταγραφή του προβλήματος;",["Να καταγράψει τη λύση","Να εντοπίσει το πρόβλημα","Να αλλάξει εξαρτήματα","Να κάνει επανεγκατάσταση Windows"],1,"Σελ. 8: εντοπισμός → τρόπος επίλυσης → δοκιμή → έλεγχος λειτουργίας → καταγραφή."],
["Ποιο είναι το ΤΕΛΕΥΤΑΙΟ βήμα της διαδικασίας υποστήριξης;",["Η δοκιμή της λύσης","Η τιμολόγηση","Η καταγραφή του τρόπου αντιμετώπισης","Η απενεργοποίηση του υπολογιστή"],2,"Σελ. 8: καταγράφουμε πώς λύθηκε, για να το βρούμε γρήγορα την επόμενη φορά."],
["Πότε ΔΕΝ βοηθάει η απομακρυσμένη υποστήριξη;",["Όταν ο χρήστης είναι σε άλλη πόλη","Όταν η βλάβη αφήνει τον υπολογιστή χωρίς Internet","Όταν το πρόβλημα είναι στο Word","Όταν είναι Σάββατο"],1,"Σελ. 8–9: χωρίς σύνδεση στο Internet δεν μπορεί να γίνει απομακρυσμένη σύνδεση."],
["Στο TeamViewer, τι δίνει ο χρήστης στον τεχνικό για να συνδεθεί;",["Τον κωδικό του email του","Το ID και τον κωδικό (Password) που δείχνει το πρόγραμμα","Τον αριθμό της πιστωτικής του κάρτας","Τη διεύθυνση του σπιτιού του"],1,"Σελ. 9: ο χρήστης τρέχει το QuickSupport και λέει στον τεχνικό το ID και τον κωδικό."],
["Κάποιος σας τηλεφωνεί «από τη Microsoft» και ζητά να συνδεθεί στον υπολογιστή σας γιατί «έχετε ιό». Τι κάνετε;",["Του δίνω το ID για να βοηθήσει","Κλείνω. Είναι πιθανότατα απάτη","Του δίνω τα στοιχεία της κάρτας μου","Κάνω ό,τι μου λέει"],1,"Οι μεγάλες εταιρείες δεν τηλεφωνούν απρόσκλητες. Δίνουμε πρόσβαση ΜΟΝΟ σε τεχνικό που καλέσαμε εμείς."],
["Ποια φράση ταιριάζει σε επαγγελματία τεχνικό;",["«Τι του κάνατε πάλι;»","«Αν κατάλαβα σωστά, το πρόβλημα ξεκίνησε μετά την ενημέρωση;»","«Αυτό είναι πανεύκολο, δεν το ξέρετε;»","«Κάντε flush το DNS cache»"],1,"Σελ. 9–10: επαναλαμβάνουμε με δικά μας λόγια για να επιβεβαιώσουμε, χωρίς ορολογία και χωρίς να κατηγορούμε."],
["Πόσο συχνά πρέπει να ελέγχεται το γραμματοκιβώτιο υποστήριξης (email);",["Μία φορά την εβδομάδα","Τουλάχιστον δύο φορές την ημέρα","Μόνο όταν τηλεφωνήσει ο πελάτης","Μία φορά τον μήνα"],1,"Σελ. 10: τουλάχιστον δύο φορές την ημέρα. Ο πελάτης περιμένει απάντηση την ίδια εργάσιμη."],
["Τι είναι ένα διάγραμμα ροής (flow chart) στην τεχνική υποστήριξη;",["Ένα γράφημα με τις πωλήσεις","Ένα σχήμα με ερωτήσεις ΝΑΙ/ΟΧΙ που οδηγεί από το πρόβλημα στη λύση","Ο κατάλογος με τις τιμές","Ένα πρόγραμμα antivirus"],1,"Σελ. 11–12: π.χ. το Σχ. 1.2 για πρόβλημα κάρτας γραφικών και οθόνης."],
["Οι περισσότερες σελίδες βοήθειας είναι στα αγγλικά. Τι βοηθάει;",["Να τις αγνοούμε","Να ξέρουμε τα αγγλικά ονόματα των εξαρτημάτων και να χρησιμοποιούμε αυτόματη μετάφραση","Να τις τυπώνουμε","Να αγοράζουμε νέο υπολογιστή"],1,"Σελ. 14–15: αγγλικά ειδικότητας + Google Μετάφραση για τη γενική έννοια."],
["Ποιος χρόνος ανταπόκρισης ταιριάζει σε φαρμακείο που δεν μπορεί να εκτελέσει συνταγές χωρίς υπολογιστή;",["48 ώρες","24 ώρες","4 ώρες","Μία εβδομάδα"],2,"Σελ. 15–16: τα συμβόλαια προβλέπουν απόκριση σε 4, 12, 24 ή 48 ώρες. Όσο πιο κρίσιμο, τόσο πιο γρήγορα (και ακριβότερα)."],
["Τι ΔΕΝ περιλαμβάνεται συνήθως στην τιμή ενός συμβολαίου υποστήριξης;",["Η απομακρυσμένη υποστήριξη","Η προληπτική συντήρηση","Τα ανταλλακτικά","Η τηλεφωνική υποστήριξη"],2,"Σελ. 16: η τιμή συνήθως δεν περιλαμβάνει ανταλλακτικά ή λογισμικό που θα χρειαστεί."],
["Ποιο από τα παρακάτω ΑΝΕΒΑΖΕΙ την τιμή ενός συμβολαίου;",["Μεγαλύτερος χρόνος ανταπόκρισης (48 ώρες)","Λιγότεροι υπολογιστές","Περισσότερες συσκευές και πιο σύνθετο λογισμικό (π.χ. λογιστικό, backup)","Κανένα από αυτά"],2,"Σελ. 16: η τιμή εξαρτάται από τον χρόνο ανταπόκρισης, το πλήθος των συσκευών και την πολυπλοκότητα του λογισμικού."]
];
let order=[],i=0,score=0;
const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function start(){order=shuffle(Q.map((_,k)=>k));i=0;score=0;document.getElementById('sc').textContent=0;show()}
function show(){
 if(i>=order.length) return end();
 const q=Q[order[i]];const opts=shuffle(q[1].map((t,k)=>[t,k===q[2]]));
 app.innerHTML=`<div class="progress"><div style="width:${i/order.length*100}%"></div></div><div class="meta">Ερώτηση ${i+1} από ${order.length}</div><div class="q">${q[0]}</div><div id="o"></div><div id="f"></div>`;
 const box=document.getElementById('o');
 opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o[0];b.dataset.ok=o[1]?1:0;b.onclick=()=>{
  box.querySelectorAll('button').forEach(x=>{x.disabled=true;if(x.dataset.ok==1)x.classList.add('ok')});
  if(o[1]){score++;document.getElementById('sc').textContent=score}else b.classList.add('no');
  document.getElementById('f').innerHTML=`<div class="fb"><b>${o[1]?'✔ Σωστά!':'✘ Λάθος.'}</b> ${q[3]}</div><button class="btn" id="nx">${i+1<order.length?'Επόμενη →':'Αποτέλεσμα'}</button>`;
  document.getElementById('nx').onclick=()=>{i++;show()};
 };box.appendChild(b)});
}
function end(){
 const p=Math.round(score/Q.length*100);
 const m=p>=90?'Έτοιμος/η για Help Desk! 🏆':p>=70?'Πολύ καλά! Λίγη επανάληψη ακόμα.':p>=50?'Καλή αρχή. Ξαναδιάβασε τις σελ. 7–16.':'Ξαναδοκίμασε μετά από επανάληψη.';
 app.innerHTML=`<div class="meta" style="text-align:center">ΑΠΟΤΕΛΕΣΜΑ</div><div class="big">${score} / ${Q.length}</div><p style="text-align:center;font-size:22px">${m}</p><p style="text-align:center;color:#64748B">Γράψε το σκορ σου στο φύλλο εργασίας.</p><div style="text-align:center"><button class="btn" onclick="start()">Ξανά (άλλη σειρά)</button></div>`;
}
start();
</script></body></html>
